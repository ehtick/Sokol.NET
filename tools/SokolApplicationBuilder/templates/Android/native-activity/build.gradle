buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 8.10.1 is the newest AGP that runs on the wrapper's Gradle 8.12.1 and supports compileSdk 36
        classpath 'com.android.tools.build:gradle:8.10.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}