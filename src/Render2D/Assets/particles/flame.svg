<svg xmlns="http://www.w3.org/2000/svg" width="64" height="96" viewBox="0 0 64 96">
  <!-- Rocket/cannon engine flame. Attribute-based fills only (NanoSVG has no CSS-class support).
       Transparent edges so it reads correctly under additive blend. -->
  <defs>
    <radialGradient id="flame" cx="50%" cy="66%" r="62%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="30%"  stop-color="#FFE08A" stop-opacity="0.95"/>
      <stop offset="62%"  stop-color="#FF8A2E" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#E04010" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M32 94 C 10 70, 18 42, 32 3 C 46 42, 54 70, 32 94 Z" fill="url(#flame)"/>
</svg>
